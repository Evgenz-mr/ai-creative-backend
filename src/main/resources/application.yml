server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ai-creative-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
